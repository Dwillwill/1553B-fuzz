<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1553B 总线协议模糊测试工具</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" focusable="false">
            <rect class="logo-controller" x="4" y="18" width="12" height="12" rx="2"></rect>
            <path class="logo-bus" d="M16 24H29M29 9V39M29 10H35M29 24H35M29 38H35"></path>
            <rect class="logo-terminal top" x="35" y="6" width="9" height="8" rx="2"></rect>
            <rect class="logo-terminal middle" x="35" y="20" width="9" height="8" rx="2"></rect>
            <rect class="logo-terminal bottom" x="35" y="34" width="9" height="8" rx="2"></rect>
            <circle class="logo-signal" cx="23" cy="24" r="2"></circle>
          </svg>
        </div>
        <div class="brand-name">
          <strong>1553B 总线协议</strong>
          <strong>模糊测试工具</strong>
          <small>MIL-STD-1553B · FUZZ LAB</small>
        </div>
      </div>

      <nav class="nav-list" aria-label="工作台导航">
        <button class="nav-item active" data-view="campaign">
          <span class="nav-symbol">01</span>
          <span>测试编排</span>
        </button>
        <button class="nav-item" data-view="board">
          <span class="nav-symbol">02</span>
          <span>板卡与目标</span>
        </button>
        <button class="nav-item" data-view="logs">
          <span class="nav-symbol">03</span>
          <span>运行日志</span>
          <span class="nav-count" id="logCount">0</span>
        </button>
      </nav>

      <div class="sidebar-spacer"></div>
      <div class="connection-panel">
        <div class="connection-head">
          <span class="status-dot" id="sidebarDot"></span>
          <strong id="sidebarStatus">就绪</strong>
        </div>
        <p id="sidebarDetail">等待测试任务</p>
      </div>
      <div class="offline-label">LOCAL · OFFLINE</div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="viewEyebrow">FUZZ CAMPAIGN</p>
          <h1 id="viewTitle">测试编排</h1>
          <p class="context-line" id="contextLine">模拟后端 · 总线 A · 通道 0</p>
        </div>
        <div class="topbar-actions">
          <div class="status-pill idle" id="statusPill">
            <span></span>
            <b id="statusText">就绪</b>
          </div>
          <button class="button secondary stop-button" id="stopButton" disabled>
            <span aria-hidden="true">■</span> 停止
          </button>
          <button class="button primary" id="startButton">
            <span aria-hidden="true">▶</span> 开始测试
          </button>
        </div>
      </header>

      <div class="content-scroll">
        <section class="view active" id="view-campaign">
          <div class="metrics-row">
            <article class="metric">
              <span class="metric-accent teal"></span>
              <strong id="scenarioMetric">9</strong>
              <small>已选场景</small>
            </article>
            <article class="metric">
              <span class="metric-accent blue"></span>
              <strong id="strategyMetric">3</strong>
              <small>变异策略</small>
            </article>
            <article class="metric">
              <span class="metric-accent coral"></span>
              <strong id="caseMetric">100</strong>
              <small>计划用例</small>
            </article>
            <article class="metric">
              <span class="metric-accent amber"></span>
              <strong id="busMetric">A</strong>
              <small>总线通道</small>
            </article>
          </div>

          <div class="campaign-layout">
            <div class="campaign-primary">
              <section class="panel">
                <div class="panel-heading">
                  <div>
                    <span class="section-index">01</span>
                    <h2>测试场景</h2>
                  </div>
                  <div class="text-actions">
                    <button type="button" id="clearScenarios">清空</button>
                    <button type="button" id="selectAllScenarios">全选</button>
                  </div>
                </div>
                <div class="scenario-grid">
                  <label class="select-tile">
                    <input type="checkbox" name="scenario" value="bc_rt_control" checked>
                    <span class="check-ui"></span>
                    <span><b>单终端控制下发</b><small>BC → RT</small></span>
                  </label>
                  <label class="select-tile">
                    <input type="checkbox" name="scenario" value="bc_rt_sync_data" checked>
                    <span class="check-ui"></span>
                    <span><b>同步数据</b><small>BC → RT</small></span>
                  </label>
                  <label class="select-tile">
                    <input type="checkbox" name="scenario" value="bc_broadcast_data" checked>
                    <span class="check-ui"></span>
                    <span><b>广播数据</b><small>BC → RTs</small></span>
                  </label>
                  <label class="select-tile">
                    <input type="checkbox" name="scenario" value="bc_broadcast_sync_data" checked>
                    <span class="check-ui"></span>
                    <span><b>广播同步数据</b><small>BC → RTs</small></span>
                  </label>
                  <label class="select-tile">
                    <input type="checkbox" name="scenario" value="bc_broadcast_sync_no_data" checked>
                    <span class="check-ui"></span>
                    <span><b>同步指令</b><small>广播 · 无数据</small></span>
                  </label>
                  <label class="select-tile">
                    <input type="checkbox" name="scenario" value="rt2_rt3_transfer" checked>
                    <span class="check-ui"></span>
                    <span><b>终端间通信</b><small>RT2 → RT3</small></span>
                  </label>
                  <label class="select-tile">
                    <input type="checkbox" name="scenario" value="last_command_readback" checked>
                    <span class="check-ui"></span>
                    <span><b>Last Command</b><small>命令回读</small></span>
                  </label>
                  <label class="select-tile">
                    <input type="checkbox" name="scenario" value="bc_query_rt_status" checked>
                    <span class="check-ui"></span>
                    <span><b>RT 状态查询</b><small>BC → RT</small></span>
                  </label>
                  <label class="select-tile">
                    <input type="checkbox" name="scenario" value="rt_bc_data_report" checked>
                    <span class="check-ui"></span>
                    <span><b>数据上报</b><small>RT → BC</small></span>
                  </label>
                </div>
              </section>

              <section class="panel">
                <div class="panel-heading">
                  <div>
                    <span class="section-index">02</span>
                    <h2>测试策略</h2>
                  </div>
                </div>
                <div class="strategy-grid">
                  <label class="strategy-tile teal">
                    <input type="checkbox" name="strategy" value="bit_level" checked>
                    <span class="strategy-number">A</span>
                    <span><b>位级扰动</b><small>翻转 · 反转 · 混合</small></span>
                    <span class="check-ui"></span>
                  </label>
                  <label class="strategy-tile blue">
                    <input type="checkbox" name="strategy" value="structured" checked>
                    <span class="strategy-number">B</span>
                    <span><b>结构化模糊</b><small>协议字段边界组合</small></span>
                    <span class="check-ui"></span>
                  </label>
                  <label class="strategy-tile coral">
                    <input type="checkbox" name="strategy" value="semantic" checked>
                    <span class="strategy-number">C</span>
                    <span><b>语义敏感模糊</b><small>业务语义冲突注入</small></span>
                    <span class="check-ui"></span>
                  </label>
                </div>
              </section>
            </div>

            <aside class="panel task-panel">
              <div class="panel-heading">
                <div>
                  <span class="section-index">03</span>
                  <h2>任务参数</h2>
                </div>
              </div>
              <div class="field-stack">
                <label class="field">
                  <span>用例数量上限</span>
                  <input id="limit" value="100" inputmode="numeric">
                </label>
                <label class="field">
                  <span>每条重复次数</span>
                  <input id="repeatEach" value="1" inputmode="numeric">
                </label>
                <label class="field">
                  <span>发送间隔 <em>ms</em></span>
                  <input id="intervalMs" value="200" inputmode="numeric">
                </label>
                <label class="field">
                  <span>单条超时 <em>ms</em></span>
                  <input id="timeoutMs" value="3000" inputmode="numeric">
                </label>
                <label class="field">
                  <span>随机种子</span>
                  <input id="seed" value="1" inputmode="numeric">
                </label>
                <label class="field">
                  <span>日志文件</span>
                  <input id="outPath" value="runs/web_latest.jsonl">
                </label>
              </div>
            </aside>
          </div>
        </section>

        <section class="view" id="view-board">
          <div class="board-layout">
            <section class="panel board-main">
              <div class="panel-heading">
                <div>
                  <span class="section-index">01</span>
                  <h2>运行后端</h2>
                </div>
              </div>
              <div class="segmented" id="backendSwitch">
                <label>
                  <input type="radio" name="backend" value="mock" checked>
                  <span>模拟后端</span>
                </label>
                <label>
                  <input type="radio" name="backend" value="native">
                  <span>真实板卡</span>
                </label>
              </div>
              <label class="field wide-field">
                <span>适配器 DLL</span>
                <input id="dllPath" value="board_adapter\mil1553_board_adapter.dll" disabled>
              </label>

              <div class="panel-heading subsection">
                <div>
                  <span class="section-index">02</span>
                  <h2>板卡与总线</h2>
                </div>
              </div>
              <div class="form-grid">
                <label class="field">
                  <span>板卡编号</span>
                  <input id="cardIndex" value="0" inputmode="numeric">
                </label>
                <label class="field">
                  <span>通道编号</span>
                  <input id="channel" value="0" inputmode="numeric">
                </label>
                <label class="field">
                  <span>总线通道</span>
                  <select id="bus"><option>A</option><option>B</option></select>
                </label>
              </div>
            </section>

            <section class="panel board-target">
              <div class="panel-heading">
                <div>
                  <span class="section-index">03</span>
                  <h2>终端目标</h2>
                </div>
              </div>
              <div class="form-grid two-columns">
                <label class="field">
                  <span>目标 RT 地址</span>
                  <input id="rtTargets" value="1">
                </label>
                <label class="field">
                  <span>普通子地址</span>
                  <input id="subaddresses" value="1">
                </label>
                <label class="field">
                  <span>数据字数</span>
                  <input id="wordCounts" value="1,2,16,0">
                </label>
                <label class="field">
                  <span>RT2 发送端</span>
                  <input id="rt2Source" value="2">
                </label>
                <label class="field">
                  <span>RT3 接收端</span>
                  <input id="rt3Destination" value="3">
                </label>
              </div>
              <div class="toggle-list">
                <label class="toggle-row">
                  <span><b>打开时不复位</b><small>配合外部 BM 监控</small></span>
                  <input type="checkbox" id="noReset"><i></i>
                </label>
                <label class="toggle-row">
                  <span><b>仅生成用例</b><small>不向真实总线发送</small></span>
                  <input type="checkbox" id="dryRun"><i></i>
                </label>
              </div>
            </section>
          </div>
        </section>

        <section class="view log-view" id="view-logs">
          <div class="run-overview">
            <div class="run-state">
              <span class="large-status-dot" id="largeStatusDot"></span>
              <div>
                <small>CAMPAIGN STATUS</small>
                <strong id="largeStatusText">就绪</strong>
                <p id="largeStatusDetail">等待测试任务</p>
              </div>
            </div>
            <div class="progress-block">
              <div><span>执行进度</span><b id="progressText">0 / 0</b></div>
              <div class="progress-track"><i id="progressBar"></i></div>
            </div>
          </div>
          <section class="console-panel">
            <div class="console-toolbar">
              <div><span class="console-light red"></span><span class="console-light amber"></span><span class="console-light green"></span></div>
              <strong>RUN LOG</strong>
              <button type="button" id="clearLogs">清空显示</button>
            </div>
            <div class="console" id="console" aria-live="polite">
              <div class="empty-log" id="emptyLog">等待测试任务</div>
            </div>
          </section>
        </section>
      </div>

      <footer class="run-dock">
        <div class="dock-status">
          <span class="status-dot" id="dockDot"></span>
          <div><b id="dockStatus">就绪</b><small id="dockDetail">等待测试任务</small></div>
        </div>
        <div class="dock-progress"><i id="dockProgress"></i></div>
        <button class="button secondary stop-button" id="dockStopButton" disabled>■ 停止</button>
        <button class="button primary" id="dockStartButton">▶ 开始测试</button>
      </footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
